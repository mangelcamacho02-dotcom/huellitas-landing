<!doctype html>
<html lang="es">
<head>

  <meta name="description" content="Baño Navideño Completo para tu perro en Huellitas Vet, San José. De {{ colones(cfg.PRECIO_ANCLA) }} a {{ colones(cfg.PRECIO_OFERTA) }}. Cupos limitados por día.">

</head>
<body>
  <a class="skip" href="#reservar">Saltar al formulario de reserva</a>
